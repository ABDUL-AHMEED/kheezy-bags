<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery & Shop - Kheeyz Bags</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpeg" href="logo.jpg.jpeg">
</head>
<body>

    <header class="navbar">
        <div class="logo">KHEEYZ BAGS</div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="store.html" class="active">Gallery/Shop</a>
            <a href="service.html">Services</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <section class="page-container">
        <div class="page-title">
            <h2>Our Gallery & Collection</h2>
            <p>Add your favorite items to your cart and checkout smoothly via WhatsApp.</p>
        </div>

        <div class="search-container">
            <input type="text" id="shopSearch" onkeyup="filterProducts()" placeholder="🔍 Search bags (e.g., croc, red, tote, zainny, adorn)...">
        </div>

        <main class="product-grid" id="productGrid"></main>
    </section>

    <div class="floating-cart" id="floatingCart" style="display: none;">
        <div class="cart-details">
            <span id="cartCount">0 items</span> Selected | <strong>Total: <span id="cartTotal">₦0</span></strong>
        </div>
        <button class="checkout-btn" onclick="checkoutToWhatsApp()">Checkout on WhatsApp 💬</button>
    </div>

    <footer class="site-footer">
        <p>Designed & Built by <a href="https://wa.me/2349133125043?text=Hi,%20I%20saw%20the%20Kheeyz%20Bags%20site%20and%20want%20to%20inquire%20about%20a%20website!" target="_blank">Abdul-ahmeed</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
