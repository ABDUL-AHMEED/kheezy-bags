<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery/Shop - Kheezy Bags</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg.jpeg">
    <link rel="stylesheet" href="style.css">
</head>
<body>

     <header class="navbar">
        <div class="logo">KHEEYZ BAGS</div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="store.html" class="active">Gallery/Shop</a>
            <a href="service.html">Services</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>


    <section class="page-container">
        <div class="page-title">
            <h2>Our Gallery & Collection</h2>
            <p>Add your favorite items to your cart and checkout smoothly via WhatsApp.</p>
        </div>

        <div class="search-container">
            <input type="text" id="shopSearch" oninput="filterProducts()" placeholder="Search bags by color, style, material, vibe... 🔍">
        </div>

        <div class="product-grid" id="productGrid">
            </div>
    </main>

    <div class="floating-cart" id="floatingCart" style="display: none;">
        <div class="cart-details">
            <span id="cartCount">0 items</span> Selected | <strong>Total: <span id="cartTotal">₦0</span></strong>
        </div>
        <button class="checkout-btn" onclick="checkoutToWhatsApp()">Checkout on WhatsApp 💬</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
